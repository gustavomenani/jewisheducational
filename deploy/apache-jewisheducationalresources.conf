# Frontend — jewisheducationalresources.asteron.digital
# API interna Docker: 127.0.0.1:7860 (nao conflita com Formosa 7841-7843, etc.)
<VirtualHost *:80>
    ServerName jewisheducationalresources.asteron.digital

    DocumentRoot /var/www/jewisheducationalresources/frontend/dist
    <Directory /var/www/jewisheducationalresources/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    Alias /.well-known/acme-challenge /var/www/html/.well-known/acme-challenge
    <Directory "/var/www/html/.well-known/acme-challenge">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass /.well-known/acme-challenge !
    ProxyPass /api/ http://127.0.0.1:7860/api/
    ProxyPassReverse /api/ http://127.0.0.1:7860/api/
    ProxyPass /uploads/ http://127.0.0.1:7860/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:7860/uploads/

    ErrorLog ${APACHE_LOG_DIR}/jewisheducationalresources-error.log
    CustomLog ${APACHE_LOG_DIR}/jewisheducationalresources-access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =jewisheducationalresources.asteron.digital
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
