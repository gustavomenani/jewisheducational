# API — api.jewisheducationalresources.org.asteron.digital → Docker :7860
<VirtualHost *:80>
    ServerName api.jewisheducationalresources.org.asteron.digital

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:7860/
    ProxyPassReverse / http://127.0.0.1:7860/

    ErrorLog ${APACHE_LOG_DIR}/api-jewisheducationalresources-error.log
    CustomLog ${APACHE_LOG_DIR}/api-jewisheducationalresources-access.log combined

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =api.jewisheducationalresources.org.asteron.digital
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
